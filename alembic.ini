# Alembic configuration.
#
# Deliberately absent: `sqlalchemy.url`. The database URL is read at runtime by
# migrations/env.py from the `config` module (config.load_config), so there is exactly one
# place that knows how to reach the store and no credential ever lands in a tracked file.
#
# Deliberately unused: `alembic revision --autogenerate`. There are no SQLAlchemy models to
# diff against (ADR-0001); every revision is hand-written raw SQL and target_metadata is None.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Revisions are numbered by hand (0001_expand, 0002_...), matching docs/data/data-model.md.
# `alembic revision -m "..."` is not the normal path here; when used, keep the prefix.
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
