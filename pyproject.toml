[project]
name = "corporate-asset-scanner"
version = "0.1.0"
description = "On-prem corporate asset scanner: discovery, entity resolution, correlation, AI-assisted insight."
requires-python = ">=3.12"
# Runtime dependencies are deliberately minimal at P1: the domain is pure and needs
# nothing but pydantic. The persistence driver and migration tool land in P2 (ADR-0001).
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# This is an application, not a distributable library: no build backend, no install step.
# Whether it ships as a module of the OSINT platform or a sibling repo is still open
# (AGENTS.md §1); keeping it non-packaged avoids baking that choice in now.
package = false

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations (mypy --strict's companion)
    "S",         # flake8-bandit
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez — timestamps are UTC-aware (AGENTS.md §5)
    "T20",       # flake8-print — no stray print(); structured logging only
    "PT",        # flake8-pytest-style
    "SIM",       # flake8-simplify
    "TID",       # flake8-tidy-imports
    "RUF",
]
ignore = [
    # Prose in docstrings mirrors docs/ verbatim, en dashes and section signs included.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test
# The error names are the published contract (ports.md §1); N818's "-Error" suffix
# convention does not get to rename `ScopeViolation`.
"domain/errors.py" = ["N818"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["domain", "adapters", "engine", "config", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
